[project]
name = "bitget-supermarket-trader"
version = "0.1.0"
description = "AI-native short-term trader for Bitget US-stock perpetuals (reversal-then-trend entry; AI decides everything, code only enforces risk and safety)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "numpy>=1.26",
]

[project.scripts]
supermarket = "supermarket.engine:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supermarket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]