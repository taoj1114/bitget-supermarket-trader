# bitget-supermarket-trader 配置
# 密钥一律从 .env 注入 (${VAR} 语法), 不落 yaml

mode: paper                  # paper | live  (live 需 LIVE_CONFIRM=yes + 账户有余额)
scan_interval: 1800          # 兼容字段(隔夜默认)
interval_regular: 300        # 美股盘中: 5 分钟一轮(管仓及时, 用户 2026-09-18 要求)
interval_prepost: 900        # 盘前/盘后: 15 分钟
interval_closed: 1800        # 隔夜: 30 分钟
scan_open_every: 3           # 开仓扫描每 3 轮一次(盘中=15分钟; 管仓每轮都跑, 保持进货纪律)
momentum_exit_floor: 1.5     # 程序兜底: 动量乏力+浮盈≥1.5% → 直接兑现(用户批准; 实证回吐率66.2% vs 推进中40.1%)
time_stop_hours: 48          # 时间止损(短期v3.0): 开仓满48h未平 → 程序强制兑现(防滞销; 周末休市也计入)
skip_weekend: true           # 周末(美东六日)完全停机不扫描, 省token; 持仓由交易所侧TPSL保护
max_symbols_per_round: 15    # 每轮并发扫描的标的上限(决策并行, 执行串行)

# ---- 下单参数(用户确认的设计) ----
margin_per_trade_usd: 2.0    # 每批保证金默认 $2(AI 未给 margin_usd 时)
margin_min_usd: 0.5          # AI 可用的每批保证金下限
margin_max_usd: 5.0          # AI 可用的每批保证金上限
leverage: 20                 # 杠杆上限(执行时取 min(20, 合约maxLever))
leverage_min: 3              # AI 可用的最低杠杆(名义=$2×杠杆; 3x=$6 仍满足交易所最低$5)
margin_mode: crossed         # 全仓模式(核心: 整体保证金扛亏损单)

# ---- 风控硬约束 ----
max_notional_mult: 6.0       # 总名义(多+空合计) ≤ 账户净值 × 6  (爆仓线≈-16%)
max_positions_divisor: 10    # 兼容字段(实际仓数 by risk.py 净值×6÷每仓, 硬顶6)
max_short_positions: 3       # 空头最大仓数(用户2026-09-23: 多开空单, 空单净盈利多单) — 升到3
max_batches_per_symbol: 3    # 分批建仓上限(超市补货, 加仓不占标的名额)
spy_drop_gate_pct: -3.0               # 天气门: SPY 24h 跌超此值 → 当日禁开新仓
spy_intraday_drop_gate_pct: -2.5      # 实时戒备: SPY现价较已收盘日线收盘急跌≥2.5% → 当日禁开新仓
# market_down_adx: 已废弃(2026-09-24 用户: 去掉大盘日线门控, 短期不需要)
# K线取量按周期需求定(非统一200): 5m=入场时机8h 1H=趋势10天 4H=中趋势50天 1D=方向权威(上限90) 1W=季节视角(上限13)
kline_limits:
  5m: 100
  15m: 60
  1H: 240
  4H: 300
  1D: 90
  1W: 13
min_turnover_floor: 300000   # 24h 成交额 ≥ $30万 才入池(2026-09实测: 美股永续中位仅$11.6万, 原$5M只筛出16只→候选枯竭)
sl_min_pct: 1.5              # 短期v3.0(用户2026-09-22): 止损下限 1.5%(不再给中期呼吸空间)
sl_max_pct: 5.0              # 短期: 止损上限 5%(超过=认错失控, 不做中期大止损)
min_rr: 1.0                  # 短期v3.2(2026-09-23 用户: 先挂1.5~2%止盈止损, RR≈1.0靠55-65%胜率, 管仓跟随)
tp_max_pct: 10.0              # 短期: TP 距离上限(用户2026-09-22: 新开仓止盈给太高; >10% 程序拒绝)
stop_repost_diff_pct: 0.2    # SL/TP 变化>0.2% 才重挂交易所 TPSL
max_daily_drawdown_pct: 5.0  # 日亏损 ≥5% 净值 → 当日禁开新仓(2026-09收紧: 原30%要连亏6次才触发)
max_consecutive_losses: 3    # 连亏3 → 暂停
pause_after_loss_minutes: 120

# ---- 标的池 ----
symbol_pool: AUTO            # AUTO=美股全市场按流动性过滤; 或显式 [NVDAUSDT,...]
hot_pool_size: 25            # 固定热门池(2026-09-23 用户: 不要漫无目的全池筛选): 白名单∪成交额top补齐
hot_symbols: [NVDAUSDT, TSLAUSDT, AAPLUSDT, MSFTUSDT, AMZNUSDT, GOOGLUSDT,
              METAUSDT, PLTRUSDT, AMDUSDT, COINUSDT, MSTRUSDT, SMCIUSDT,
              AVGOUSDT, NFLXUSDT, SNDKUSDT, MUUSDT, INTCUSDT, ARMUSDT,
              ORCLUSDT, HOODUSDT, IRENUSDT, MRVLUSDT, CRCLUSDT, AAOIUSDT]

# ---- AI ----
llm:
  base_url: ${LLM_BASE_URL}
  api_key: ${LLM_API_KEY}
  model: ${LLM_MODEL_FLASH}
  temperature: 0.3
  max_tokens: 16000  # deepseek-v4.1-flash 为思考型(实测简单问题 reasoning 137 tokens, 正文仅2): 额度太小 → reasoning吃光 → content为空; 2026-09-25 提到16000
  timeout_s: 120  # 2026-09-29: deepseek-v4.1-flash 为思考型, 实测单轮决策 57.8s, 原 45s 必然超时→降级HOLD
  max_retries: 3            # opencode网关并发高时空响应频繁(实测27%), 增多重试保决策覆盖
  circuit_failures: 5
  circuit_pause_s: 300
scan_workers: 4             # 决策并发线程数(实测6并发时网关empty响应27%, 降至4)

# ---- Bitget ----
bitget:
  base_url: https://api.bitget.com
  api_key: ${BITGET_API_KEY}
  secret: ${BITGET_SECRET_KEY}
  passphrase: ${BITGET_PASSPHRASE}
  timeout_s: 20

# ---- 落盘 ----
state_dir: state

# ---- 模拟 ----
paper:
  initial_equity: 50.0       # 虚拟账户 $50 (用户确认; 对应多头约6-7仓上限)
  taker_fee: 0.0006
  maker_fee: 0.0002